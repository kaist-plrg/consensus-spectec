name: PR commit log

# pull_request_target gives fork PRs a writable token. This job never checks
# out PR code, so it does not run anything the PR author controls.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

concurrency:
  group: pr-commit-log-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-log:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Replace the Commit Log section
        run: |
          gh api --paginate "repos/$GH_REPO/pulls/$PR/commits" \
            --jq '.[] | "- " + (.commit.message | split("\n")[0])' > log.md
          gh pr view "$PR" --json body --jq .body > body.md
          python3 - <<'EOF'
          import re, sys
          body = open("body.md").read().removesuffix("\n")
          log = open("log.md").read()
          new, n = re.subn(
              r"(<!-- commit-log:start -->).*?(<!-- commit-log:end -->)",
              lambda m: f"{m[1]}\n{log}{m[2]}",
              body,
              count=1,
              flags=re.S,
          )
          if n == 0 or new == body:
              sys.exit(0)
          open("new.md", "w").write(new)
          EOF
          if [ -f new.md ]; then gh pr edit "$PR" --body-file new.md; fi

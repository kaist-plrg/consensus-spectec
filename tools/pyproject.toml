[project]
name = "forkdiff"
version = "0.1.0"
description = "Fork-porting helper for the consensus SpecTec translation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
forkdiff = "forkdiff.__main__:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["forkdiff/tests"]
